<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64">
  <rect width="64" height="64" fill="#1A0A3A"/>
  <!-- Kente-inspired geometric strips -->
  <rect x="0"  y="0"  width="64" height="8"  fill="#2D1060" opacity="0.9"/>
  <rect x="0"  y="28" width="64" height="8"  fill="#2D1060" opacity="0.9"/>
  <rect x="0"  y="56" width="64" height="8"  fill="#2D1060" opacity="0.9"/>
  <!-- Gold diamonds -->
  <polygon points="8,4 12,0 16,4 12,8"   fill="#C8941A"/>
  <polygon points="24,4 28,0 32,4 28,8"  fill="#C8941A"/>
  <polygon points="40,4 44,0 48,4 44,8"  fill="#C8941A"/>
  <polygon points="56,4 60,0 64,4 60,8"  fill="#C8941A"/>
  <!-- Terracotta chevrons -->
  <polyline points="0,18 8,14 16,18 24,14 32,18 40,14 48,18 56,14 64,18"
    stroke="#B05A30" stroke-width="2.5" fill="none"/>
  <polyline points="0,22 8,26 16,22 24,26 32,22 40,26 48,22 56,26 64,22"
    stroke="#B05A30" stroke-width="2.5" fill="none"/>
  <!-- Indigo vertical accents -->
  <rect x="0"  y="8" width="4" height="20" fill="#1E3A8A" opacity="0.7"/>
  <rect x="30" y="8" width="4" height="20" fill="#1E3A8A" opacity="0.7"/>
  <rect x="60" y="8" width="4" height="20" fill="#1E3A8A" opacity="0.7"/>
</svg>
