<svg xmlns="http://www.w3.org/2000/svg" width="24" height="48">
  <!-- Body (woven garment - deep violet) -->
  <rect x="7" y="16" width="10" height="24" rx="2" fill="#4A1A8A"/>
  <!-- Garment kente strips -->
  <rect x="7" y="19" width="10" height="3" fill="#C8941A" opacity="0.7"/>
  <rect x="7" y="25" width="10" height="3" fill="#B05A30" opacity="0.7"/>
  <rect x="7" y="31" width="10" height="3" fill="#1E3A8A" opacity="0.7"/>
  <!-- Head -->
  <ellipse cx="12" cy="11" rx="5" ry="6" fill="#6B3A2A"/>
  <!-- Needle glow hint -->
  <line x1="17" y1="22" x2="22" y2="16" stroke="#66EEFF" stroke-width="1.5" opacity="0.8"/>
  <circle cx="22" cy="16" r="2" fill="#66EEFF" opacity="0.9"/>
  <!-- Legs -->
  <rect x="8"  y="40" width="4" height="7" rx="1" fill="#3A1060"/>
  <rect x="12" y="40" width="4" height="7" rx="1" fill="#3A1060"/>
</svg>
